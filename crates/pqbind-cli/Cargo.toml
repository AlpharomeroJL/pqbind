[package]
name = "pqbind-cli"
description = "The pqbind command line: an attack demo, a verifier and a post-quantum probe."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["post-quantum", "quic", "tls", "cli", "probe"]
categories = ["command-line-utilities", "cryptography"]

[lints]
workspace = true

[[bin]]
name = "pqbind"
path = "src/main.rs"
# The library crate is also named `pqbind`, and both would write the same rustdoc output file.
doc = false

[dependencies]
pqbind = { workspace = true, features = ["quinn", "rustls"] }
pqbind-crypto = { workspace = true }
clap = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
tokio-rustls = { workspace = true }
