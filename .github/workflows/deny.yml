name: deny

on:
  push:
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories show up without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: deny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; the comment after each one names the version it was resolved from.
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans sources advisories
