name: deny

on:
  push:
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories show up without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: deny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin to full commit SHAs before publishing (TODO(owner)); version tags are used until then.
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
