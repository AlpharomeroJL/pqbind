name: reuse

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin to full commit SHAs before publishing (TODO(owner)); version tags are used until then.
jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@v5
