[workspace]
resolver = "3"
members = ["crates/pqbind-crypto", "crates/pqbind", "crates/pqbind-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["VaultScribe Limited Liability Company"]
# Not published yet. Remove this line only on purpose, when the first release is ready.
publish = false
# TODO(owner): add `repository` and `homepage` once the public repository exists (cargo warns that they are missing).
readme = "README.md"
keywords = ["post-quantum", "ml-dsa", "hybrid-signature", "quic", "tls"]
categories = ["cryptography"]
# Verified: the full test suite passes on Rust 1.94.1, and `cargo check --workspace --all-features --offline --locked` on 1.94.1 and 1.99.0, the only stable toolchains
# installed where this was checked. Older versions were not tried, so this is the lowest version known to work, not a proven floor.
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Crypto (pqbind-crypto)
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
hkdf = "0.13"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
rand = "0.10"
sha2 = { version = "0.11", features = ["zeroize"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc", "derive"] }

# Core library
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["io-util", "time"] }

# Transports, each used only behind its own feature of `pqbind`
iroh = { version = "1.3", default-features = false, features = ["tls-aws-lc-rs", "metrics"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

# Command line, tests and tooling
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
proptest = "1.12"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"

pqbind-crypto = { path = "crates/pqbind-crypto", version = "0.0.0" }
pqbind = { path = "crates/pqbind", version = "0.0.0" }
